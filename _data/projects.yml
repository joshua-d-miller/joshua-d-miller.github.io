# Projects shown in the sidebar, on the home page and on /projects/.
# `page` is the project's page on this site; `repo` is its GitHub repository.
# `hidden: true` keeps a project (and its page) off the site entirely.
- name: macOSLAPS
  page: /projects/macoslaps/
  repo: https://github.com/joshua-d-miller/macOSLAPS
  icon: /assets/img/projects/macoslaps-icon.png
  summary: >-
    Rotates the password of a local administrator account on macOS and
    escrows it to Active Directory or keeps it for your MDM. LAPS, for Macs.
