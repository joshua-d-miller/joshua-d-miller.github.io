---
layout: page
title: All posts
lede: Everything I've written, newest first.
---
{%- for group in collections.postsByYear -%}
<section class="archive-year">
  <h2 id="y{{ group.year }}">{{ group.year }}</h2>
  <ul class="archive-list">
    {%- for post in group.posts -%}
    <li>
      <a href="{{ post.url | relative_url }}">{{ post.data.title }}</a>
      <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date_fmt: 'LLL d' }}</time>
    </li>
    {%- endfor -%}
  </ul>
</section>
{%- endfor -%}
