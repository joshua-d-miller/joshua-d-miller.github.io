# Site settings
title: System Administrator Musings
description: >-
  Notes from managing macOS and iOS devices, plus the open-source tools
  that came out of it: macOSLAPS and Family Chalk Planner.
url: https://www.joshua-d-miller.com
baseurl: ""
lang: en-US
timezone: America/New_York
permalink: /:title/

# Author (shown in the sidebar and used for SEO/social cards)
author:
  name: Joshua D. Miller
  image: /assets/img/author.jpg
  bio: >-
    Husband, father, and avid administrator of devices.
social:
  github: joshua-d-miller
  linkedin: millerjoshuad
  email: josh.miller@outlook.com
  # mastodon: https://mastodon.social/@you   # optional
  # twitter: joshuadmiller_                   # optional

# jekyll-seo-tag
twitter:
  username: joshuadmiller_
logo: /assets/img/author.jpg

# Writing
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true
  toc_levels: 2..3

# Home page pagination
paginate: 10
paginate_path: /page/:num/

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-gist
  - jemoji

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "projects" }
    values: { layout: project }

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
  - _templates
  - .bundle
